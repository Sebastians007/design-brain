<!--
  Acid-Green Stickers on Black — caption skin.

  Visual: no card at all - bold white text sitting directly on the dark stage, exactly like the video's
  lower-third captions ('using custom eases'). Hanken Grotesk/Inter 700, sentence case, tight tracking.
  Upcoming words are dimmed white; the current word is the preset's signature acid-green STICKER: black
  heavy type on a flat green rounded rectangle with a 3px dark-green border (no shadow, no blur, no
  layout shift via box-shadow spread). Spoken words settle to full white, sticker cleared.
  Black, white and a single acid green only. Meant for the dark stage and dark editor frames.

  Built to the cobalt-grid caption-skin contract: captions.mjs fills the empty GROUPS array, the 0
  duration/width/height holes and the empty data-brand-tokens style. Tokens used (fixed vocab, literal
  fallbacks from this preset): --cap-ink --cap-canvas --cap-accent --cap-accent-2 --font-display
  --font-body --cap-band-top --cap-band-height. Hooks: .caption-group / .caption-word + .is-active /
  .is-spoken, root data-composition-id="captions", timeline at window.__timelines["captions"]. State
  changes use gsap.set({className}), never tl.call().
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>

<style>
  #captions-root { position: absolute; inset: 0; pointer-events: none; }
  .caption-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .caption-stage {
    position: absolute; left: 0; right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex; align-items: center; justify-content: center;
  }
  .caption-group {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
  }
  /* no card: bold white text directly on the stage */
  .caption-pill {
    position: relative;
    max-width: 78%;
    padding: 12px 24px;
    background: transparent;
  }
  .caption-line {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0.1em 0.34em;
    font-family: var(--font-display, "Hanken Grotesk"), "Inter", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.2;
    letter-spacing: -0.03em;
  }
  /* upcoming - dimmed white */
  .caption-word {
    display: inline-block;
    padding: 0 0.08em;
    border-radius: 0.14em;
    color: color-mix(in srgb, var(--cap-ink, #ffffff) 50%, var(--cap-canvas, #000000));
  }
  /* current - the acid-green sticker: black type, green fill, dark-green border */
  .caption-word.is-active {
    color: var(--cap-canvas, #000000);
    background: var(--cap-accent, #41e33f);
    box-shadow: 0 0 0 0.06em var(--cap-accent-2, #0b6b1c);
  }
  /* spoken - full white, sticker cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #ffffff);
    background: transparent;
    box-shadow: none;
  }
  .caption-word.cap-brand { font-weight: 900; }
  .caption-word.cap-num {
    font-family: var(--font-body, "Spline Sans Mono"), ui-monospace, monospace;
    color: var(--cap-accent, #41e33f);
  }
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent, #41e33f);
    text-underline-offset: 0.1em;
  }
  @media (max-aspect-ratio: 9/16) {
    .caption-pill { max-width: 92%; }
    .caption-line { font-size: clamp(34px, 5.4vw, 48px); }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
