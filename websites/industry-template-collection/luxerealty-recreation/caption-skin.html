<!-- LuxeRealty companion caption skin. Newly designed video adaptation, not a feature from the source site.
Derived from the user-supplied caption skin. Preserve the empty GROUPS array, DURATION=0,
zero composition duration/dimensions, and data-brand-tokens injection hole.
Hooks: .caption-group / .caption-word / .is-active / .is-spoken;
window.__timelines["captions"]. State changes remain GSAP sets for seek safety.
Keep assets/ beside this fragment. Inject real values before rendering.
Tokens: --cap-ink, --cap-canvas, --cap-accent, --cap-accent-2, --font-display,
--font-body, --cap-band-top, --cap-band-height. --font-display is Riviera Nights Trial Regular for captions.
--cap-canvas only affects color mixing; the video frame supplies the scene background.
Default adaptation: 1920x1080, bottom 180px band, Riviera Nights Trial Regular 500, thin accent current-word underline.
-->
<style>
@font-face{font-family:"Outfit";src:url(assets/fonts/outfit-600-0.woff2);font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Riviera Nights Trial Regular";src:url(assets/fonts/riviera-nights-trial-regular-400-1.woff2);font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Riviera Nights Trial Medium";src:url(assets/fonts/riviera-nights-trial-medium-500-2.woff2);font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Riviera Nights Trial Bold";src:url(assets/fonts/riviera-nights-trial-bold-700-3.woff2);font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"BT Suave Regular";src:url(assets/fonts/bt-suave-regular-400-4.woff2);font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-400-5.woff2);font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-700-6.woff2);font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-700-7.woff2);font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-400-8.woff2);font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-700-9.woff2);font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-700-10.woff2);font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-400-11.woff2);font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-400-12.woff2);font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-900-13.woff2);font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-900-14.woff2);font-weight:900;font-style:italic;font-display:swap}
@font-face{font-family:"Satoshi";src:url(assets/fonts/satoshi-700-15.woff2);font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Manrope";src:url(assets/fonts/manrope-600-16.woff2);font-weight:600;font-style:normal;font-display:swap}

</style>
<script src="assets/js/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* LuxeRealty-inspired companion: medium sans type, no chip/card/shadow. */
  .caption-pill {
    position: relative;
    max-width: 78%;
    padding: 12px 24px 16px;
    background: transparent;
    border: 0;
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.22em;
    font-family: var(--font-display, "Riviera Nights Trial Regular"), system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(34px, 3.8vw, 58px);
    line-height: 1.08;
    letter-spacing: -0.02em;
  }

  /* upcoming — faint ink */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #232327) 38%, var(--cap-canvas, #ffffff));
  }
  /* current word — full ink with a thin accent underline; companion adaptation */
  .caption-word.is-active {
    color: var(--cap-ink, #232327);
    background: linear-gradient(to top, var(--cap-accent, #3900ad) 0 6%, transparent 6%);
  }
  /* already spoken — solid ink, marker cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #232327);
    background: transparent;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  .caption-word.cap-brand {
    font-family: "Riviera Nights Trial Regular", serif;
    font-style: normal;
    font-weight: 500;
  }
  .caption-word.cap-num,
  .caption-word.cap-cta {
    font-family: var(--font-body, "Riviera Nights Trial Regular"), ui-monospace, monospace;
    font-weight: 500;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill { max-width: 92%; }
    .caption-line { font-size: clamp(30px, 6vw, 48px); }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
